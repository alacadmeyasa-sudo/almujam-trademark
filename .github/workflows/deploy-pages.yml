name: Deploy landing page to GitHub Pages

on:
  push:
    branches:
      - claude/wordpress-arabic-landing-page-jae5hz
  workflow_dispatch:

# Permissions needed for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable GitHub Pages on the repo if it isn't already
          enablement: true

      - name: Stage site files
        run: |
          mkdir -p _site
          # The landing page is the site entry point
          cp index.html _site/index.html
          # Legal translation (Oman) landing page
          cp legal-translation-oman.html _site/legal-translation-oman.html
          # Ship the importable Elementor template + docs as downloadable assets
          cp elementor-template.json _site/elementor-template.json
          cp README.md _site/README.md

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
